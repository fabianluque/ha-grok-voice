<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kiosk Satellite relay</title>
<style>
:root{--bg:#fafafa;--card:#fff;--text:#212121;--muted:#727272;--line:#e0e0e0;--accent:#03a9f4;--err:#db4437;--ok:#43a047;--input:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#111;--card:#1c1c1c;--text:#e1e1e1;--muted:#9b9b9b;--line:#2f2f2f;--accent:#2196f3;--input:#262626}}
*{box-sizing:border-box}body{margin:0;font:14px/1.45 Roboto,"Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--text)}
header{background:var(--accent);color:#fff;padding:12px 16px;font-size:20px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
nav button{background:none;border:0;color:#fff;opacity:.75;font-size:14px;padding:6px 10px;cursor:pointer;border-bottom:2px solid transparent}
nav button.on{opacity:1;border-color:#fff}
main{max-width:1100px;margin:0 auto;padding:16px}
.card{background:var(--card);border-radius:12px;box-shadow:0 1px 3px rgba(0,0,0,.15);padding:16px;margin-bottom:16px}
h2{font-size:16px;margin:0 0 12px}h3{font-size:14px;margin:12px 0 6px}
label{display:block;margin:8px 0 2px;color:var(--muted);font-size:12px}
input,select,textarea{width:100%;padding:7px 8px;border:1px solid var(--line);border-radius:6px;background:var(--input);color:var(--text);font:inherit}
textarea{min-height:70px;font-family:ui-monospace,Menlo,monospace;font-size:12px}
input[type=checkbox]{width:auto}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
button.b{background:var(--accent);color:#fff;border:0;border-radius:6px;padding:7px 14px;cursor:pointer;margin:8px 8px 0 0;font:inherit}
button.s{background:none;color:var(--accent);border:1px solid var(--line)}
button.d{background:none;color:var(--err);border:1px solid var(--line)}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.muted{color:var(--muted)}.err{color:var(--err);white-space:pre-wrap}.ok{color:var(--ok)}
.skills{display:grid;grid-template-columns:240px 1fr;gap:16px}@media(max-width:800px){.skills{grid-template-columns:1fr}}
.sk{padding:8px;border-radius:8px;cursor:pointer;display:flex;gap:8px;align-items:center}.sk.on{background:rgba(3,169,244,.15)}
.act{border:1px solid var(--line);border-radius:8px;padding:10px;margin:8px 0}
pre{white-space:pre-wrap;background:var(--input);border:1px solid var(--line);border-radius:6px;padding:8px;font-size:12px}
.tot{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.tot div{border:1px solid var(--line);border-radius:8px;padding:10px}.tot b{font-size:20px;display:block}
tr.click{cursor:pointer}tr.click:hover{background:rgba(3,169,244,.08)}svg text{fill:var(--muted);font-size:10px}
.pill{display:inline-block;padding:1px 8px;border-radius:10px;border:1px solid var(--line);font-size:11px;margin-left:4px}
.wf{margin:8px 0 0;min-width:0}.wf-row{display:grid;grid-template-columns:minmax(44px,64px) minmax(0,1fr);gap:8px;padding:5px 0;border-bottom:1px solid var(--line);align-items:start}
@media(max-width:600px){.wf-row{grid-template-columns:44px minmax(0,1fr);gap:6px}.wf-t{font-size:11px}.wf-leg{font-size:10px;gap:6px 8px}.wf-axis{font-size:9px}}
.wf-t{color:var(--muted);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap;font-size:12px}
.wf-track{position:relative;height:10px;background:rgba(127,127,127,.12);border-radius:4px;margin:0 0 4px}
.wf-bar{position:absolute;top:1px;height:8px;border-radius:3px;min-width:2px}
.wf-tick{position:absolute;top:0;width:3px;height:10px;border-radius:1px;background:var(--muted);transform:translateX(-50%)}
.wf-bar.speech{background:#7e57c2}.wf-bar.latency{background:#fb8c00}.wf-bar.speak{background:var(--ok)}
.wf-bar.ha{background:var(--accent)}.wf-bar.mem{background:#00897b}
.wf-axis{position:relative;height:16px;font-size:10px;color:var(--muted);margin:0 0 6px}
.wf-axis span{position:absolute;top:0;white-space:nowrap}
.wf-leg{display:flex;flex-wrap:wrap;gap:8px 12px;font-size:11px;color:var(--muted);margin:0 0 8px}
.wf-leg i{display:inline-block;width:10px;height:8px;border-radius:2px;margin-right:4px;vertical-align:middle}
.wf-leg i.speech{background:#7e57c2}.wf-leg i.latency{background:#fb8c00}.wf-leg i.speak{background:var(--ok)}
.wf-leg i.ha{background:var(--accent)}.wf-leg i.mem{background:#00897b}.wf-leg i.tick{width:3px;height:10px;background:var(--muted)}
.wf-meta{color:var(--muted);font-size:12px;margin-top:2px}
.wf-pay{margin-top:4px;font-size:12px}.wf-pay button{margin:0 0 0 6px;padding:2px 8px}
.wf-pay pre{display:none;max-height:240px;overflow:auto;margin:6px 0 0}
.wf-pay.open pre{display:block}
.pill.ok{border-color:var(--ok);color:var(--ok)}
.chart{position:relative}.chart-tip{position:absolute;z-index:3;background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:12px;box-shadow:0 2px 8px rgba(0,0,0,.25);pointer-events:none;max-width:240px;line-height:1.4}
.chart-tip[hidden]{display:none!important}
</style>
</head>
<body>
<header>Kiosk Satellite relay <nav id="tabs"></nav><span id="conn" class="muted" style="color:#fff;margin-left:auto;font-size:12px"></span></header>
<main id="main"></main>
<script>
"use strict";
const TABS=["Status","Settings","Skills","Tablets","Test"];let tab="Status",S=null,draft=null,selSkill=0,msgId=0,pending={},ws,previewTimer,retries=0,banner="";
const $=(h)=>{const t=document.createElement("template");t.innerHTML=h.trim();return t.content.firstChild};
const esc=(s)=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmtT=(t)=>t?new Date(t*1000).toLocaleString([], {hour:"numeric",minute:"2-digit",month:"short",day:"numeric"}):"";
const med=(a)=>{if(!a||!a.length)return"";const b=[...a].sort((x,y)=>x-y);return b[Math.floor(b.length/2)]};
function panelBasePath(){let p=location.pathname.replace(/\/index\.html$/,"/");p=p.replace(/\/relay\/?$/, "/");if(!p.endsWith("/"))p+="/";return p}
function adminWsUrl(){const u=new URL(location.href);u.protocol=u.protocol==="https:"?"wss:":"ws:";u.search="";u.hash="";u.pathname=panelBasePath()+"relay/ws";return u.toString()}
function testFrameSrc(){return panelBasePath()+"test/"}
function failPending(why){Object.keys(pending).forEach(id=>{const p=pending[id];delete pending[id];try{p({errors:[why]})}catch(_){}});pending={}}
function connect(){const u=adminWsUrl();conn("connecting…");
 try{ws=new WebSocket(u)}catch(e){banner="Could not open panel socket: "+e;conn("failed");render();return}
 const openTimer=setTimeout(()=>{if(ws&&ws.readyState===0)ws.close(4000,"open timeout")},8000);
 ws.onopen=()=>{clearTimeout(openTimer);retries=0;conn("connected");call({op:"load"}).then(d=>{if(d.errors){banner=d.errors.join("\n");S=null;render();return}S=d;if(d.relay)S.relay=d.relay;draft=JSON.parse(JSON.stringify(d.skills||[]));banner="";render()}).catch(e=>{banner=String(e.message||e);render()})};
 ws.onerror=()=>{conn("socket error")};
 ws.onclose=(e)=>{clearTimeout(openTimer);const why=`closed ${e.code}${e.reason?": "+e.reason:""}`;failPending(why);
  if(retries<5){retries+=1;conn("disconnected, retrying…");banner=closeExplain(e)+" Retrying…";render();setTimeout(connect,Math.min(1500*retries,8000))}
  else{conn("disconnected");banner=closeExplain(e)+" Automatic retry stopped.";render()}};
 ws.onmessage=(e)=>{let d;try{d=JSON.parse(e.data)}catch{return}const p=pending[d.id];if(p){delete pending[d.id];p(d)}}}
function closeExplain(e){if(e.code===4403)return "Panel websocket needs Home Assistant ingress (open Grok Voice from the sidebar). "+(e.reason||"");
 if(e.code===1011)return "Panel backend is not running. "+(e.reason||"");
 if(e.code===4000||e.reason==="open timeout")return "Timed out waiting for the panel websocket.";
 if(!e.code||e.code===1006)return "Panel websocket closed before load finished"+(e.reason?": "+e.reason:"")+".";
 return "Panel websocket "+(e.reason||("closed "+e.code))+"."}
function conn(t){const n=document.getElementById("conn");if(n)n.textContent=t}
function call(m,ms=10000){return new Promise((resolve,reject)=>{if(!ws||ws.readyState!==1){reject(new Error("not connected"));return}
  m.id=++msgId;const t=setTimeout(()=>{if(pending[m.id]){delete pending[m.id];reject(new Error("request timed out"))}},ms);
  pending[m.id]=(d)=>{clearTimeout(t);resolve(d)};
  try{ws.send(JSON.stringify(m))}catch(e){clearTimeout(t);delete pending[m.id];reject(e)}})}
function nav(){const n=document.getElementById("tabs");n.innerHTML="";TABS.forEach(t=>{const b=$(`<button class="${t==tab?"on":""}">${t}</button>`);b.onclick=()=>{tab=t;render()};n.append(b)})}
function render(){nav();const m=document.getElementById("main");m.innerHTML="";
 if(banner){const b=$(`<div class="card"><p class="err">${esc(banner)}</p><button class="b s" type="button">Retry</button></div>`);b.querySelector("button").onclick=()=>{retries=0;banner="";connect();render()};m.append(b);if(!S&&tab!=="Test")return}
 if(!S){if(tab==="Test"){testClient(m);return}m.append($(`<p class="muted">Loading…</p>`));return}
 ({Status:status,Settings:settings,Skills:skills,Tablets:tablets,Test:testClient})[tab](m)}
function relayInfo(){return (S&&S.relay)||(S&&S.status&&S.status.relay)||{}}
// ---------- status
function status(m){const r=relayInfo();
 m.append($(r.listening
  ? `<div class="card"><h2>Relay <span class="pill">on :${esc(r.port)}</span></h2><p class="muted">Tablets: Endpoint <code>ws://&lt;ha-host&gt;:${esc(r.port)}/v1/realtime?model=grok-voice-latest</code>, API key = the relay secret, Tools = None.</p></div>`
  : `<div class="card"><h2>Relay <span class="pill">off</span></h2><p class="err">The tablet listener is off: ${esc(r.reason||"no relay secret set")}. Set or generate a secret on the Settings tab — it applies without restarting the add-on. This panel still works.</p></div>`));
 const st=S.status,ses=st.sessions;
 const c=$(`<div class="card"><h2>Live sessions <span class="pill">${st.ha_ready?"HA connected":"HA not connected"}</span></h2></div>`);
 c.append(ses.live.length?table(["Tablet","Since","Ready","Speech stopped → first audio"],ses.live.map(s=>[esc(s.tablet),fmtT(s.started),s.ready_ms??"",s.turns.join(", ")])):$(`<p class="muted">No tablet connected.</p>`));m.append(c);
 if(st.stats)stats(m,st.stats);else{
 const r=$(`<div class="card"><h2>Recent sessions</h2><p class="muted">Latency is measured from xAI's speech_stopped to the first audio sent to the tablet.</p></div>`);
 r.append(ses.recent.length?table(["Tablet","Started","Length","Ready ms","Turns (ms)","Median","Tools"],ses.recent.map(s=>[esc(s.tablet),fmtT(s.started),Math.round((s.ended-s.started))+" s",s.ready_ms??"",s.turns.join(", "),med(s.turns),esc(s.tools.map(t=>`${t.name}${t.ok?"":" ✗"} ${t.ms}ms`).join(", "))])):$(`<p class="muted">None yet.</p>`));m.append(r)}
 const mm=$(`<div class="card"><h2>Short-term memory</h2></div>`);const by={};st.memory.forEach(i=>{(by[i.tablet]=by[i.tablet]||[]).push(i)});
 if(!st.memory.length)mm.append($(`<p class="muted">Empty.</p>`));
 Object.entries(by).forEach(([id,items])=>{mm.append($(`<h3>${esc(items[0].tablet_name)}</h3>`));mm.append(table(["When","Kind","Text","Tool facts"],items.map(i=>[fmtT(i.started),i.kind,esc(i.text),esc((i.facts||[]).join("\n"))])));
  const b=$(`<button class="b d">Clear ${esc(items[0].tablet_name)}</button>`);b.onclick=()=>call({op:"clear_memory",tablet:id}).then(d=>{S.status=d.status;render()});mm.append(b)});
 if(st.memory.length){const b=$(`<button class="b d">Clear all</button>`);b.onclick=()=>{if(confirm("Clear all short-term memory?"))call({op:"clear_memory"}).then(d=>{S.status=d.status;render()})};mm.append(b)}
 m.append(mm)}
const usd=x=>x==null?"":"$"+(x>0&&x<1?x.toFixed(4):x.toFixed(2)),ms=x=>x==null?"–":Math.round(x)+" ms";let openRow=null;
function stats(m,x){
 const c=$(`<div class="card"><h2>Usage and cost <span class="pill">estimates</span></h2><p class="muted">Realtime is priced per minute of session time, summaries per token, at the prices in Settings. Latency: speech stopped → first audio.</p><div class="tot"></div></div>`);
 [["Today","today"],["7 days","7d"],["30 days","30d"]].forEach(([n,k])=>{const t=x.totals[k];c.querySelector(".tot").append($(`<div><span class="muted">${n}</span><b>${usd(t.cost)}</b>${t.sessions} sessions · ${t.minutes} min<br><span class="muted">realtime ${usd(t.realtime_cost)} · summaries ${usd(t.summary_cost)}<br>median ${ms(t.latency_median)} · p90 ${ms(t.latency_p90)}</span></div>`))});
 c.append($(`<h3>Daily cost, last 30 days</h3>`));c.append(chart(x.daily));m.append(c);
 const tb=$(`<div class="card"><h2>Per tablet (30 days)</h2></div>`);
 tb.append(x.tablets.length?table(["Tablet","Sessions","Minutes","Realtime","Summaries","Total","Median","p90"],x.tablets.map(t=>[esc(t.tablet),t.sessions,t.minutes,usd(t.realtime_cost),usd(t.summary_cost),usd(t.cost),ms(t.latency_median),ms(t.latency_p90)])):$(`<p class="muted">No sessions yet.</p>`));m.append(tb);
 const r=$(`<div class="card"><h2>Recent sessions</h2><p class="muted">Click a row for details.</p></div>`);
 if(!x.recent.length){r.append($(`<p class="muted">None yet.</p>`));m.append(r);return}
 const t=table(["Tablet","Started","Length","Ready","Turns","Median","p90","Tools","Est. cost"],[]);
 x.recent.forEach(s=>{const tr=$(`<tr class="click"><td>${esc(s.tablet)}${s.error?' <span class="err">✗</span>':""}</td><td>${fmtT(s.started)}</td><td>${s.duration_s} s</td><td>${ms(s.ready_ms)}</td><td>${s.turns}</td><td>${ms(s.latency_median)}</td><td>${ms(s.latency_p90)}</td><td>${s.tools.length}</td><td>${usd(s.realtime_cost)}</td></tr>`);
  tr.onclick=()=>{openRow=openRow===s.id?null:s.id;render()};t.tBodies[0].append(tr);
  if(openRow===s.id){const detail=$(`<tr><td colspan="9"></td></tr>`);const cell=detail.querySelector("td");if(cell)cell.append(sessionDetail(s));t.tBodies[0].append(detail)}});
 r.append(t);m.append(r)}
function asText(v){if(v==null||v==="")return"";if(typeof v==="object"){try{return JSON.stringify(v,null,2)}catch(e){return String(v)}}return String(v)}
function payloadBlock(label,value){const full=asText(value);if(!full)return null;const short=full.length>180?full.slice(0,180)+"…":full;
 const wrap=$(`<div class="wf-pay"><span class="muted">${esc(label)}:</span> <code>${esc(short)}</code></div>`);
 if(full.length>180){const b=$(`<button class="b s" type="button">full</button>`);const pre=$(`<pre></pre>`);pre.textContent=full;
  b.onclick=e=>{e.stopPropagation();const on=wrap.classList.toggle("open");b.textContent=on?"hide":"full"};wrap.append(b);wrap.append(pre)}
 return wrap}
function kindLabel(e){const k=e.kind||"";
 if(k==="connect")return "KS connected (auth ok)";
 if(k==="session.update")return "KS session.update received"+(e.tools!=null?` · ${e.tools} tools`:"");
 if(k==="upstream_open")return "upstream xAI open";
 if(k==="session.updated")return "session.updated (ready)"+(e.ready_ms!=null?` · ${e.ready_ms} ms`:"");
 if(k==="clock_refresh")return "clock refresh (session.update)";
 if(k==="speech_started")return "speech start (VAD)";
 if(k==="speech_stopped")return "speech stop (VAD)";
 if(k==="transcript")return `${e.role==="user"?"user":"assistant"}: ${e.text||""}`;
 if(k==="first_audio")return "first audio"+(e.e2s_ms!=null?` · end-of-speech → audio ${e.e2s_ms} ms`:"");
 if(k==="tool"){const n=e.skill?`skill ${e.skill}${e.action?"."+e.action:""}`:(e.name||"tool");
  return `tool ${n}${e.ok===false?" ✗":""}${e.cached?" · cache hit":""}`}
 if(k==="provider_tool"){const pretty=(e.name||"search").replace(/_/g," ");const q=providerQuery(e.arguments);
  return `${pretty} (xAI)${q?" · "+q:""}`}
 if(k==="output_item")return `${(e.item_type||"item").replace(/_/g," ")}${e.name?" · "+e.name:""} (xAI)`;
 if(k==="upstream_event")return `upstream ${e.type||"event"}${e.item_type?" · "+e.item_type:""}`;
 if(k==="response.done")return "response.done"+(e.status?" · "+e.status:"");
 if(k==="memory_summary")return `memory summary (${e.summary_kind||"summary"})`;
 if(k==="session_end")return `session end · ${e.reason||""}`;
 if(k==="end_conversation")return "end_conversation";
 if(k==="error")return `error ${e.code||""} ${e.message||""}`.trim();
 if(k==="omitted")return e.detail||"further events dropped";
 return k}
function providerQuery(args){if(!args)return"";let o=args;if(typeof args==="string"){try{o=JSON.parse(args)}catch(e){return""}}
 if(o&&typeof o==="object")return String(o.query||o.q||o.keyword||o.search_query||"").slice(0,120);return""}
function providerToolSummary(s){const counts={};(s.timeline||[]).forEach(e=>{if(e.kind==="provider_tool"&&e.name)counts[e.name]=(counts[e.name]||0)+1});
 return Object.entries(counts).map(([n,c])=>c>1?`${n} ×${c}`:n).join(", ")}
function eventMeta(e){const bits=[];
 if(e.kind==="tool"){if(e.call_to_dispatch_ms!=null)bits.push(`call → dispatch ${e.call_to_dispatch_ms} ms`);
  if(e.ha_ms!=null)bits.push(`HA ${e.ha_ms} ms`);
  if(e.result_to_audio_ms!=null)bits.push(`result → first audio ${e.result_to_audio_ms} ms`);
  if(e.cached)bits.push("answered from session cache")}
 if(e.kind==="provider_tool")bits.push("xAI reports this after the spoken answer");
 if(e.kind==="response.done"){if(e.e2s_to_first_audio_ms!=null)bits.push(`end-of-speech → first audio ${e.e2s_to_first_audio_ms} ms`);
  if(e.first_audio_to_done_ms!=null)bits.push(`first audio → done ${e.first_audio_to_done_ms} ms`);
  if(e.total_ms!=null)bits.push(`total ${e.total_ms} ms`);
  if(e.audio_s!=null)bits.push(`audio ${e.audio_s} s`);
  const u=e.usage||{};const tok=["input_tokens","output_tokens","total_tokens","input_audio_tokens","output_audio_tokens","billable_audio_seconds"].filter(k=>u[k]!=null).map(k=>`${k} ${u[k]}`);
  if(tok.length)bits.push(tok.join(" · "));
  if(e.output&&e.output.length)bits.push(e.output.map(o=>[o.type,o.name,o.status].filter(Boolean).join(" ")).join("; "))}
 if(e.kind==="memory_summary"){if(e.ms!=null)bits.push(`${e.ms} ms`);if(e.model)bits.push(e.model);if(e.input_tokens!=null)bits.push(`in ${e.input_tokens}`);if(e.output_tokens!=null)bits.push(`out ${e.output_tokens}`);if(e.chars!=null)bits.push(`${e.chars} chars`)}
 return bits.join(" · ")}
function pct(ms,span){if(!span)return 0;return Math.round(Math.max(0,Math.min(100,(ms||0)/span*100))*100)/100}
function eventMark(e,i,ev,span){if(e.kind==="speech_started"){const stop=ev.slice(i+1).find(x=>x.kind==="speech_stopped");
  if(stop&&stop.t>e.t)return {cls:"speech",left:pct(e.t,span),width:pct(stop.t-e.t,span)}}
 if(e.kind==="first_audio"&&e.e2s_ms>0)return {cls:"latency",left:pct(e.t-e.e2s_ms,span),width:pct(e.e2s_ms,span)};
 if(e.kind==="response.done"&&e.first_audio_to_done_ms>0)return {cls:"speak",left:pct(e.t-e.first_audio_to_done_ms,span),width:pct(e.first_audio_to_done_ms,span)};
 if(e.kind==="tool"&&e.ha_ms>0)return {cls:"ha",left:pct(e.t-e.ha_ms,span),width:pct(e.ha_ms,span)};
 if(e.kind==="memory_summary"&&e.ms>0)return {cls:"mem",left:pct(e.t-e.ms,span),width:pct(e.ms,span)};
 return {tick:true,left:pct(e.t,span)}}
function timelineView(s){const ev=s.timeline||[];if(!ev.length)return null;
 const last=ev[ev.length-1];const span=Math.max((s.duration_s||0)*1000,last.t||1,1);
 const box=$(`<div class="wf"></div>`);
 const axis=$(`<div class="wf-row"><div></div><div class="wf-axis"><span style="left:0">0</span><span style="left:50%;transform:translateX(-50%)">${Math.round(span/2)} ms</span><span style="left:100%;transform:translateX(-100%)">${Math.round(span)} ms</span></div></div>`);
 box.append(axis);
 const leg=$(`<div class="wf-row"><div></div><div class="wf-leg"><span><i class="speech"></i>speech</span><span><i class="latency"></i>end-of-speech → audio</span><span><i class="speak"></i>speaking</span><span><i class="ha"></i>HA tool</span><span><i class="mem"></i>memory</span><span><i class="tick"></i>instant</span></div></div>`);
 box.append(leg);
 ev.forEach((e,i)=>{const row=$(`<div class="wf-row"><div class="wf-t">${e.t==null?"":e.t+" ms"}</div><div class="wf-body"></div></div>`);
  const body=row.querySelector(".wf-body");
  const mark=eventMark(e,i,ev,span);
  const track=$(`<div class="wf-track"></div>`);
  if(mark.tick)track.append($(`<span class="wf-tick" data-kind="tick" style="left:${mark.left}%"></span>`));

    m.append(u);
  }
  const c=$(`<div class="card"><h2>Tablets</h2><p class="muted">Detected IPs come from each Home Assistant device's configuration URL and ipv4 address sensor. Per-tablet overrides (JSON). Allowed keys: ${S.tablet_keys.join(", ")}. Example: {"reasoning_effort":"high","tools":{"locks":"off"}}. Empty = house settings.</p></div>`);
  S.tablets.forEach(t=>{
    const cur=S.settings.tablets[t.device_id];
    const haIps=(t.ips&&t.ips.length)?t.ips.join(", "):"none yet";
    const kind=t.kind==="kiosk_satellite"?'<span class="pill">KS</span>':"";
    const block=$(`<div><h3>${esc(t.name)} ${kind} <span class="muted">${esc(t.area)} · ${esc(t.device_id)}</span></h3><p class="muted">Detected IP(s): ${esc(haIps)}</p><div class="assigned"></div><textarea data-id="${esc(t.device_id)}">${cur?esc(JSON.stringify(cur,null,1)):""}</textarea></div>`);
    (t.assigned_ips||[]).forEach(ip=>{
      const row=$(`<p>Assigned ${esc(ip)} <button class="b d" type="button">Remove</button></p>`);
      row.querySelector("button").onclick=()=>assignIp(ip, "");
      block.querySelector(".assigned").append(row);
    });
    c.append(block);
  });
  const b=$(`<div><button class="b" type="button">Save overrides</button><span class="err" id="terr"></span></div>`);
  c.append(b);m.append(c);
  b.querySelector("button").onclick=()=>{
    const t={};let bad="";
    c.querySelectorAll("textarea").forEach(x=>{if(!x.value.trim())return;try{t[x.dataset.id]=JSON.parse(x.value)}catch{bad+=`${x.dataset.id}: not JSON\n`}});
    if(bad){document.getElementById("terr").textContent=bad;return}
    call({op:"save_settings",settings:{...S.settings,tablets:t}}).then(d=>applyTabletSave(d,"terr")).catch(e=>{document.getElementById("terr").textContent=" "+e.message});
  };
}
connect();render();
</script>
</body>
</html>
