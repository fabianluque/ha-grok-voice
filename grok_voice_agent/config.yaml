name: Grok Voice Agent
version: "0.2.4"
slug: grok_voice_agent
description: Full-duplex Grok Voice Think Fast 2.0 in a browser or Kiosk Satellite dashboard. Home Assistant tools run through the local MCP server.
url: https://github.com/fabianluque/ha-grok-voice
arch:
  - aarch64
  - amd64
init: false
startup: application
boot: auto
host_network: true
homeassistant_api: true
ingress: true
ingress_port: 8099
panel_icon: mdi:microphone-message
panel_title: Grok Voice
ports:
  8080/tcp: 8080
options:
  xai_api_key: ""
  instructions: >-
    You are the voice of this home. Speak in short, natural sentences.
    Call tools silently, then give one complete answer. Do not read entity
    IDs or technical names; use ordinary names. If the device or room is
    ambiguous, ask one short question. If something fails, say what went wrong.
  voice: eve
  model: grok-voice-think-fast-2.0
  reasoning_effort: none
  enable_web_search: true
  enable_x_search: false
  ha_mcp_url: ""
  longlived_token: ""
  mcp_tool_allowlist: ""
  idle_timeout_seconds: 20
schema:
  xai_api_key: password
  instructions: str
  voice: list(eve|ara|rex|sal|leo)
  model: str
  reasoning_effort: list(none|high)
  enable_web_search: bool
  enable_x_search: bool
  ha_mcp_url: str
  longlived_token: password
  mcp_tool_allowlist: str
  idle_timeout_seconds: int(5,600)
