name: Grok Voice Agent
version: "0.2.10"
slug: grok_voice_agent
description: Full-duplex Grok Voice Think Fast 2.0 in a browser or Kiosk Satellite dashboard. Home Assistant tools run through the local MCP server.
url: https://github.com/fabianluque/ha-grok-voice
arch:
  - aarch64
  - amd64
init: false
startup: application
boot: auto
host_network: true
homeassistant_api: true
ingress: true
ingress_port: 8099
panel_icon: mdi:microphone-message
panel_title: Grok Voice
ports:
  8080/tcp: 8080
options:
  xai_api_key: ""
  instructions: >-
    You are the voice of this home. Speak in short, natural sentences.
    Call tools silently, then give one complete answer. After a simple one-shot
    home command succeeds, or when they dismiss you, speak a short ack and call
    end_session. Do not read entity IDs or technical names; use ordinary names.
    When the user does not name a room, use this satellite's area for lights,
    music, and other room-scoped devices. Do not ask which lights or which room.
    Play music through Music Assistant on that area's speaker (the Attic HomePod
    Mini when this area is Attic); do not ask which speaker. Use todo and Mealie
    tools for lists and meal plans. If they name another room, use that room.
    If something fails, say what went wrong.
  voice: eve
  model: grok-voice-think-fast-2.0
  reasoning_effort: none
  enable_web_search: true
  enable_x_search: false
  ha_mcp_url: ""
  longlived_token: ""
  mcp_tool_allowlist: ""
  idle_timeout_seconds: 20
  default_area: Attic
  default_area_id: ""
  home_location: ""
  conversation_memory_ttl_seconds: 480
schema:
  xai_api_key: password
  instructions: str
  voice: list(eve|ara|rex|sal|leo)
  model: str
  reasoning_effort: list(none|high)
  enable_web_search: bool
  enable_x_search: bool
  ha_mcp_url: str
  longlived_token: password
  mcp_tool_allowlist: str
  idle_timeout_seconds: int(5,600)
  default_area: str
  default_area_id: str
  home_location: str
  conversation_memory_ttl_seconds: int(60,3600)
