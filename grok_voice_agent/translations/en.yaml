configuration:
  xai_api_key:
    name: xAI API key
    description: Used only inside this add-on to open Grok Voice. It is never sent to the browser, tablet, or Kiosk Satellite script.
  instructions:
    name: Instructions
    description: Spoken system prompt. Keep it short so replies stay conversational.
  voice:
    name: Voice
    description: Grok Voice speaker (eve, ara, rex, sal, or leo).
  model:
    name: Model
    description: Pin a versioned Grok Voice model. grok-voice-think-fast-2.0 is the current voice model.
  reasoning_effort:
    name: Reasoning effort
    description: none keeps turns short. high thinks longer before speaking.
  enable_web_search:
    name: Web search
    description: Allow Grok to search the web during a voice session.
  enable_x_search:
    name: X search
    description: Allow Grok to search X during a voice session.
  ha_mcp_url:
    name: Home Assistant MCP URL
    description: Leave blank to use http://supervisor/core/api/mcp with the add-on token.
  longlived_token:
    name: Long-lived token
    description: Leave blank to use the add-on supervisor token for MCP. Paste a Home Assistant long-lived token only if MCP returns HTTP 401. This is not the xAI key.
  mcp_tool_allowlist:
    name: MCP tool allowlist
    description: Comma-separated MCP tool names. Blank uses HassTurnOn, HassTurnOff, HassLightSet, GetLiveContext, and GetDateTime. * allows every tool the MCP server offers.
  idle_timeout_seconds:
    name: Idle timeout
    description: Seconds of silence before the voice session ends (browser or kiosk). On Kiosk Satellite the wake word is re-armed after this.
network:
  8080/tcp: Debug mic Web UI (optional LAN access; use a secure context)
