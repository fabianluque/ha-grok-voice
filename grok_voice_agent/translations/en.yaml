configuration:
  xai_api_key:
    name: xAI API key
    description: Key used only by this add-on. It is never sent to the tablet.
  instructions:
    name: Instructions
    description: Spoken system prompt. Keep it short.
  voice:
    name: Voice
    description: Grok Voice name.
  model:
    name: Model
    description: Pin a versioned model. grok-voice-think-fast-2.0 is the current voice model.
  reasoning_effort:
    name: Reasoning effort
    description: none keeps turns short. high thinks longer before speaking.
  enable_web_search:
    name: Web search
    description: Let Grok search the web inside the voice session.
  enable_x_search:
    name: X search
    description: Let Grok search X inside the voice session.
  ha_mcp_url:
    name: Home Assistant MCP URL
    description: Leave blank to use http://supervisor/core/api/mcp.
  longlived_token:
    name: Long-lived token
    description: Leave blank to use the add-on supervisor token. Paste one here only if MCP returns 401.
  mcp_tool_allowlist:
    name: MCP tool allowlist
    description: Comma-separated tool names. Blank uses lights, media/Music Assistant, todo, Mealie, and live context (including 2026.9 names such as intent__HassTurnOn and music_assistant__play_media). * allows every tool the MCP server offers.
  idle_timeout_seconds:
    name: Idle timeout
    description: After Grok finishes speaking, seconds without user speech before the session ends and the wake word is re-armed. Default 30. A follow-up question adds 15 seconds so you can hear it and answer. Mic audio alone does not keep the session open.
  default_area:
    name: Default area
    description: Home Assistant area name used when the user does not name a room (lights, Music Assistant playback, and other room-scoped commands). The kiosk inject prefers this tablet's HA/KS area; this value is the fallback. Attic is the attic tablet.
  default_area_id:
    name: Default area ID
    description: Optional Home Assistant area_id slug (for example attic). Leave blank to derive it from the area name. Set this if Assist needs the id and the name slug is wrong.
  home_location:
    name: Home location
    description: City, region, or ZIP for local events (for example Summit, NJ). Spoken as a named city (Summit, New Jersey). Combined with Home Assistant's timezone, GPS, and zone.home at each session start. Leave blank to use HA only.
  conversation_memory_ttl_seconds:
    name: Conversation memory
    description: Seconds to keep recent turns after a session ends so a new wake on the same device can follow up. Default 480 (8 minutes). Idle hang-up keeps the turns; goodbye clears them. Keyed by a stable per-tablet id, not the room name.
